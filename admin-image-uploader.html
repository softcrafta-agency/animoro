<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Insert Images — Animoro Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#080a0f" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body class="admin-body">
  <div class="admin-image-upload-shell">
    <div class="admin-image-upload-card">
      <div class="admin-image-upload-header">
        <h2>Insert Images into Article</h2>
        <button type="button" id="closeUploaderBtn" class="action-btn-sm">Close</button>
      </div>

      <div id="statusMessage" class="status-message" aria-live="polite"></div>

      <div id="imageDropzone" class="image-dropzone" tabindex="0" role="button" aria-label="Upload images" aria-describedby="chooseImagesHint">
        <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="opacity:0.7;">
          <path d="M12 16V4"></path>
          <path d="M7 9l5-5 5 5"></path>
          <path d="M20 16.5A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5v-9A2.5 2.5 0 0 1 6.5 5h11A2.5 2.5 0 0 1 20 7.5v9z"></path>
        </svg>
        <div class="dropzone-title">Drag &amp; Drop Images Here</div>
        <div class="dropzone-subtitle" id="chooseImagesHint">or Choose Images</div>
      </div>

      <div class="image-selector-row">
        <input id="imageFileInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden />
        <button type="button" id="chooseImagesBtn" class="btn-cta">Choose Images</button>
      </div>

      <div id="selectedImageSection" class="image-selection-summary" style="display: none;">
        <div class="image-selection-header">
          <span>Selected Images</span>
          <span id="imageCountBadge" class="image-count-badge">0</span>
        </div>
        <div id="selectedImageList" class="selected-image-list"></div>
      </div>

      <div class="image-upload-actions">
        <button type="button" id="uploadImagesBtn" class="btn-cta" disabled>Insert Images</button>
      </div>
    </div>
  </div>

  <script type="module" src="/js/admin-image-uploader.js"></script>
</body>
</html>
