name: Sync festival calendar

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-festival-calendar.yml'
      - 'scripts/festival-catalog.js'
      - 'scripts/sync-festival-calendar.js'
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync source-verified festival dates
        run: node scripts/sync-festival-calendar.js
      - name: Commit calendar updates
        run: |
          if git diff --quiet -- public/festival-calendar.json; then
            echo "No verified calendar changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/festival-calendar.json
          git commit -m "Update verified festival calendar"
          git push
